services:
  app:
    build: #build docker image from Dockerfile
      context: . #dockerfile path
      dockerfile: Dockerfile
    container_name: pos-app
    ports:
      - 6111:6111
    env_file:
      - .env
    depends_on: #wait for db-local before start app
      db-local:
        condition: service_healthy
    restart: on-failure:3
    networks:
      - shared_networks

  db-local:
    container_name: pos-db
    image: postgres:latest
    ports:
      - 5435:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pos_app
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - shared_networks

volumes:
  pgdata:

networks:
  shared_networks:
    external: true #expose to localhost
    driver: bridge #allow each services to interact
